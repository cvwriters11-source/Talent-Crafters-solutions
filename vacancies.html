<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vacancies | Talent Crafters</title>
  <meta name="description" content="Browse current job vacancies from Talent Crafters and apply online.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="vac-page">
  <div id="site-header"></div>

  <main>
    <div class="vac-toolbar">
      <div class="vac-toolbar-in">
        <div class="vac-filters">
          <input type="search" id="q" placeholder="Search job title or keyword..." aria-label="Search">
          <select id="category" aria-label="Category"><option value="">All categories</option></select>
          <select id="location" aria-label="Location"><option value="">All locations</option></select>
          <select id="type" aria-label="Job type"><option value="">All types</option></select>
        </div>
        <a class="vac-alert-link" href="account.html?next=vacancies.html#register">&#128276; Create a Job Alert</a>
      </div>
    </div>

    <div class="vac-shell">
      <nav class="vac-crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> &rsaquo; <span>All Jobs</span></nav>
      <h1 class="vac-count" id="count"></h1>

      <div class="vac-wrap" id="vwrap">
        <section class="vac-listcol" aria-label="Job list">
          <div class="vac-listhead">
            <label class="vac-sort">Sort by
              <select id="sort" aria-label="Sort jobs">
                <option value="latest">Latest</option>
                <option value="oldest">Oldest</option>
                <option value="title">Job title A-Z</option>
              </select>
            </label>
            <label class="vac-saved"><input type="checkbox" id="savedonly"> Saved only</label>
          </div>
          <div id="vlist" class="vac-list"></div>
        </section>
        <section id="vdetail" class="vac-detail" aria-live="polite" aria-label="Job details"></section>
      </div>

      <div id="empty" class="empty" hidden>
        <h3>No vacancies match your search</h3>
        <p>Try different filters, or <a href="account.html">register</a> and we'll contact you when something suitable comes up.</p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/vacancies.js"></script>
  <script src="js/vacancy-browser.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => initVacancyBrowser());</script>
</body>
</html>
